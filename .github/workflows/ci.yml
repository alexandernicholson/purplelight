name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['7', '8']
        ruby: ['3.2', '4.0']
    services:
      mongo:
        image: mongo:${{ matrix.mongodb }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({hello:1})'" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Apache Arrow (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y -V ca-certificates lsb-release wget gnupg
          DIST=$(lsb_release -cs)
          wget https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$DIST.deb -O apache-arrow-apt-source.deb
          sudo apt install -y ./apache-arrow-apt-source.deb
          sudo apt-get update -y
          sudo apt-get install -y -V libarrow-dev=25.* libarrow-glib-dev=25.* libparquet-dev=25.* libparquet-glib-dev=25.*

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true


      - name: Run specs (Linux, with Mongo service)
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
        run: |
          bundle exec rspec --format progress

      - name: Run sub-two-second microbenchmarks
        run: bundle exec ruby benchmark/microbench.rb
